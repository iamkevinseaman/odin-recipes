    <h1>Instant Ramen</h1>
    <img src="https://m.media-amazon.com/images/I/61f+b5a5vOL.jpg" alt="Eh, ramen">
    <h2>Description</h2>

    <p>Instant ramen is a quick, comforting meal that brings together chewy noodles and a savory broth in just minutes. Originally developed as a convenient, affordable food, it has become a global staple, loved for its versatility and satisfying flavor. The basic version comes with dried noodles and a seasoning packet—just add hot water or a quick simmer, and you’ve got a warm bowl of slurp-worthy satisfaction.</p>
    <p>While delicious on its own, instant ramen also serves as a blank canvas for creativity. Add-ins like soft-boiled eggs, scallions, leftover vegetables, sliced meats, or a dash of chili oil can elevate it into something more substantial and personal. Whether it’s a late-night snack, a fast lunch, or a nostalgic taste of college days, instant ramen delivers comfort in a bowl with minimal effort and maximum flavor.</p>
    <h2>Ingredients</h2>
    <ul>
        <li>1 cup of Maruchen Instant Lunch/li>    
        <li>Boiling water</li>
    </ul>
    <h2>Steps</h2>
    <ol>
        <ul>Add boiling water to cup of noodles.</ul>
        <ul>Wait 60 seconds.</ul>
        <ul>Enjoy?</ul>
    </ol>
